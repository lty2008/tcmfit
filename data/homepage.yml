############################ banner ##########################
banner:
  enable : true
  title : "Choose TCMFIT Confidently."
  content: |
    Whether it’s a recent sports injury, chronic pain condition, stress, trouble sleeping, lung diseases, fertility, hormone balance, digestive issues, we are here to help. TCMFIT aims to help restore balance to the mind and body.  

    **TCMFIT accepts many types of health insurance plans, including Kaiser, Blue Shield, HealthNet, Aetna, Anthem, Cigna, Medrisk, and more**. Please obtain a PCP referral with a covered diagnostic code to guarantee insurance coverage for acupuncture service if insurance requires. **Insurance usually will only cover acupuncture for treating the symptoms listed in your referral letter**. Please send the following information **ONLY** to **info@tcmfit.com** for the **insurance eligibility check before booking your acupuncture with insurance initial appointment (or you will need to self-pay for the session)**.  

    * Photos of the front and back of your insurance card  
    * Patient's date of birth  
    * Primary care physician referral letter (photocopy if required)  

    For initial appointments, please fill 3 forms before you come (or **$30** fee):  
    - [Informed consent form](https://docs.google.com/forms/d/e/1FAIpQLSdzcsRWo0M16MsuniQzuztHRfI3IwDspZyppHqppaQbu3VNaw/viewform?usp=sf_link)  
    - [New patient registration](https://docs.google.com/forms/d/e/1FAIpQLScNHKePAIRP6ihh2hyipd526qXZ8mzEZCzeBjYjeoxGQTrnZw/viewform?usp=sf_link)  
    - [Traditional Chinese Medicine Questionnaire](https://docs.google.com/forms/d/e/1FAIpQLSdHhpfJwBabpmSL3lz4eDu7to9fnygBat2JZTB4oDMMDbTWDw/viewform?usp=sf_link)  

    For follow-up appointments, please fill the forms listed below before you come:  
    - [Informed consent form for every treatment](https://docs.google.com/forms/d/e/1FAIpQLSdzcsRWo0M16MsuniQzuztHRfI3IwDspZyppHqppaQbu3VNaw/viewform?usp=sf_link)  
    - [Progress form as needed](https://docs.google.com/forms/d/e/1FAIpQLSezmTfNbTrtNuld2oqpH2zxe7jTNlDPD1Nh98N-cX9yjRFHRw/viewform?usp=sf_link)  
    - [Medical Necessity Review (MNR) form as needed](https://docs.google.com/forms/d/e/1FAIpQLSfKishqdSKsiPPHGkL1PITRQGfOetCAxgjAfP1juGrm3jZM0w/viewform?usp=sf_link) (Member is eligible for a certain amout of visits without submission of a medical necessity review form. Insurance only covers acupuncture treatment for symptoms indicated on your referral letter.)  

    **Late cancel (<24h) or no-show fee $40**  

    Wear loose clothes, eat beforehand, shower & use restroom before coming (wait 1hr to shower after).  

    Street parking; clinic is a white 2-story building in backyard off Kelton Ave.
