########################## About ##############################
about:
  enable : true
  title : "About Ting Xie, OMD PHD LAC"
  content : "Dr. Ting Xie received her Bachelor of Medicine degree (OMD) from the prestigious Beijing University of Traditional Chinese Medicine (TCM) in China. Following her hospital externship at the Beijing Hospital of Traditional Chinese Medicine, Dr. Xie pursued a PhD at the same university. Upon earning her PhD, she became a licensed acupuncturist and herbalist of Traditional Chinese Medicine.
Dr. Xie has extensive experience as an online TCM practitioner and has conducted research on pulmonary diseases at medical centers in the USA. She specializes in treating pulmonary, digestive, cardiovascular, and bone disorders, as well as women's health issues, using acupuncture and traditional Chinese medicine. Additionally, she has authored numerous medical research papers during her tenure in medical centers. Her comprehensive education in both TCM and Western medicine provides her with a unique holistic approach to patient care."
  image : "images/about.png"
  button:
    enable : true
    label : "All Services"
    link : "products"

