  testimonialItem:
    # testimonial item loop
    - name : "anonymous"
      designation : "asthma"
      content : "I have struggled with asthma for many years, and despite using various western medications and inhalers, my condition did not significantly improve. I am very grateful to have found Ting Xie, Phd L.Ac. She took the time to thoroughly review my medical history and symptoms. Through her acupuncture and Chinese medicine treatments, I experienced significant relief; my breathing became smoother, and my persistent cough subsided. This allowed me to enjoy better sleep and rest. Additionally, her treatments strengthened my immune system, giving me more vitality and energy."
      rating : "five" # rating star, one to five
      
    # testimonial item loop
    - name : "anonymous"
      designation : "Online patient, swollen feet"
      content : "I had been struggling with swollen feet for some time, and despite seeking treatment at the hospital, the swelling persisted. I decided to consult Ting Xie, Phd L.Ac., who prescribed a regimen of Chinese medicine. Remarkably, within just three days of starting the treatment, the swelling in my feet was significantly reduced. Although the taste of the medicine is quite bitter, its effectiveness is undeniable. I am extremely grateful for Ting Xie's expertise and the remarkable results."
      rating : "five" # rating star, one to five

    # testimonial item loop
    - name : "anonymous"
      designation : "Online patient, pneumonia"
      content : "I was diagnosed with pneumonia and, despite taking prescribed medication, my condition worsened, leading to hospitalization. With my doctor's consent, Ting Xie, Phd L.Ac., prescribed Chinese medicine to complement my treatment. The combination of Western and Chinese medicine significantly improved my condition. I no longer needed the bronchoscopy I had been dreading and was discharged from the hospital sooner than expected. I feel incredibly fortunate to have received Ting's expert care and support."
      rating : "five" # rating star, one to five

    # testimonial item loop
    - name : "anonymous"
      designation : "fatigue and a lack of motivation"
      content : ".I was struggling with fatigue and a lack of motivation, which prompted me to visit the hospital. The diagnosis revealed a thyroid problem. A friend recommended Ting Xie, Phd L.Ac., and I decided to give her a try. Ting carefully assessed my condition, prescribed Chinese medicine in the form of granules, and helped me identify the root cause of my thyroid issues. Under her care, I noticed a significant improvement in my overall health, and my subsequent blood tests returned to normal levels.
      Later, I experienced severe abdominal pain and once again turned to Ting for help. She prescribed another course of Chinese medicine in the form of pills, which effectively alleviated my pain. Ting’s expertise and compassionate care have made a tremendous difference in my life. I am incredibly grateful to have found such a knowledgeable and dedicated practitioner. Thank you, Ting!"
      rating : "five" # rating star, one to five
      
    # testimonial item loop
    - name : "anonymous"
      designation : "chest tightness and frequent nighttime urination"
      content : "I have a stent in my heart but continued to experience occasional chest tightness and frequent nighttime urination, both of which severely impacted my sleep and overall well-being. A friend recommended Ting Xie, Phd LAc, and I decided to seek her help. Ting prescribed a course of Chinese medicine, and the results have been remarkable. Not only has my chest tightness significantly improved, but the frequency of my nighttime urination has also greatly decreased. My sleep quality has improved substantially, and I feel much more comfortable and rested. I am deeply grateful to Ting for her expertise and care."
      rating : "five" # rating star, one to five

    # testimonial item loop
