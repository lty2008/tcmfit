faqItem:
  - title : Do I need to fill out the online medical form before visit?
    content : "Yes, You will automatically receive the form in your confirming email once you set up the appointment, or you can click the following links for fill the appropriate forms. If you do not fill out the online form before visit, extra $30 would be charged.  \n
    1. New patient registration form  \n
    https://docs.google.com/forms/d/e/1FAIpQLScNHKePAIRP6ihh2hyipd526qXZ8mzEZCzeBjYjeoxGQTrnZw/viewform?usp=sf_link  \n
    2. Informed consent form  \n
    https://docs.google.com/forms/d/e/1FAIpQLSdzcsRWo0M16MsuniQzuztHRfI3IwDspZyppHqppaQbu3VNaw/viewform?usp=sf_link  \n
    3. Initial appointment_traditional Chinese medicine questionnaire  \n 
    https://docs.google.com/forms/d/e/1FAIpQLSdHhpfJwBabpmSL3lz4eDu7to9fnygBat2JZTB4oDMMDbTWDw/viewform?usp=sf_link  \n
    4. Medical Necessity Review (MNR) form  \n
    https://docs.google.com/forms/d/e/1FAIpQLSfKishqdSKsiPPHGkL1PITRQGfOetCAxgjAfP1juGrm3jZM0w/viewform?usp=sf_link  \n
    5. Progress form  \n
    https://docs.google.com/forms/d/e/1FAIpQLSezmTfNbTrtNuld2oqpH2zxe7jTNlDPD1Nh98N-cX9yjRFHRw/viewform?usp=sf_link  \n
    6.1 Follow-up form_female patients  \n
    https://docs.google.com/forms/d/e/1FAIpQLSdjRDdZUJOxbk1YeWsr68eCZ5wxC03x2SuJhromG-mUjSR_XQ/viewform?usp=sf_link  \n
    6.2 Follow-up form_male patients  \n
    https://docs.google.com/forms/d/e/1FAIpQLScGfKEXou8L1mafA1lf4IN91GgPAaSP5vO8vGRiKSSFv3ol-g/viewform?usp=sf_link"


  - title : If there are no preferred appointment times available online, how to accommodate me? 
    content : Simply text (310) 218-8728 or email to info@tcmfit.com. We may be able to accommodate you.
